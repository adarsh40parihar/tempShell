version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: tempshell-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-tempshell}
      MYSQL_USER: ${DB_USER:-tempshell_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-B6969Siadar}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - tempshell-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tempshell-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-tempshell_user}
      DB_PASSWORD: ${DB_PASSWORD:-B6969Siadar}
      DB_NAME: ${DB_NAME:-tempshell}
      SECRET_KEY: ${SECRET_KEY:-014aca07f664a9c329be25e32867af78bf600b3b85087033e8a0cf2484c7d533}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost","http://localhost:8000"]}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    networks:
      - tempshell-network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  tempshell-network:
    driver: bridge
